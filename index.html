<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UPMT Class Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 25px;
      color: #0072ff;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 7px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.3s;
    }

    .login-container input:focus {
      border-color: #0072ff;
      box-shadow: 0 0 5px rgba(0,114,255,0.5);
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background: #0072ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-container button:hover {
      background: #005ecb;
    }

    .login-container p {
      margin-top: 20px;
      font-size: 14px;
    }

    .login-container a {
      color: #0072ff;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 50px 40px;
      }

      .login-container h2 {
        font-size: 20px;
      }

      .login-container input,
      .login-container button {
        font-size: 14px;
      }

      .login-container p {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>UPMT Class Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Enter Your Username " required>
      <input type="password" id="password" placeholder="Enter Your Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="errorMsg"   style="color: red;"></p>
    <script src="./js/login.js"></script>
    
  </div>
</body>
</html>
